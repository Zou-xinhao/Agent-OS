on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-system-riscv bc python3-pip
      - name: Install pinned clang-format
        run: |
          sudo pip3 install --break-system-packages clang-format==20.1.8
          clang-format --version
      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code
      - name: Build kernel and fs.img
        run: make kernel/kernel fs.img
      - name: Agent required tasks
        run: ./test-xv6.py agenttests
      - name: usertests
        run: ./test-xv6.py usertests
      - name: crash tests
        run: ./test-xv6.py crash

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install riscv64-elf-gcc
      - run: make kernel/kernel fs.img
